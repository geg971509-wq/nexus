name: Audit format Stage 2

on:
  push:
    branches: [audit/network-restore-stage2]

permissions:
  contents: write

jobs:
  format:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/network-restore-stage2
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt
      - name: Format Rust sources
        working-directory: app/backend
        run: cargo fmt --all
      - name: Commit formatted Rust
        run: |
          git add app/backend/src
          if git diff --cached --quiet; then
            echo "Rust already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rustfmt stage2"
          git push origin HEAD:audit/network-restore-stage2
