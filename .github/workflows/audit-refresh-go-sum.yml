name: Audit refresh Go checksums

on:
  push:
    branches: [audit/release-hardening-20260903]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/release-hardening-20260903
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/server/go.mod
          cache: false
      - name: Refresh complete module checksums
        working-directory: core/server
        run: go mod download all
      - name: Commit generated go.sum
        run: |
          git diff -- core/server/go.sum
          git add core/server/go.sum
          if git diff --cached --quiet; then
            echo "go.sum already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "deps: refresh Go checksums"
          git push origin HEAD:audit/release-hardening-20260903
