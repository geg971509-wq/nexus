name: Update core dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-forks:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: core/server/go.sum
      - uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Go RPC bindings
        working-directory: core/server/gen
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          protoc -I . --go_out=. --go-grpc_out=. libcore.proto
          if [ -d gen ]; then
            mv gen/*.go .
            rmdir gen
          fi
      - name: Update pinned fork revisions
        run: ./build.sh --update-only
      - name: Test updated core
        working-directory: core/server
        run: go test -race -shuffle=on -count=1 ./...
      - uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            core/server/go.mod
            core/server/go.sum
          branch: automation/update-core-dependencies
          base: dev
          delete-branch: true
          commit-message: "chore(deps): update core forks"
          title: "chore(deps): update core forks"
          body: |
            Updates the pinned Throne sing-box and Xray fork revisions.

            The workflow generated RPC bindings and passed the core race-test suite before opening this PR.
