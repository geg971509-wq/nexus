name: CI

on:
  push:
    branches: [qt-dev, dev, main]
  pull_request:

jobs:
  ui:
    name: UI (i18n, metadata, scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # t() falls back to zh-CN, so a missing translation ships as Chinese text
      # in the English UI without any error. The checker also rejects missing packs.
      - run: bash script/check-i18n.sh
      - run: bash script/check-release-metadata.sh
      - name: Shell syntax
        run: bash -n build.sh script/*.sh

  core:
    name: Core (Go)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/server/go.mod
          cache-dependency-path: core/server/go.sum
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Generated *.pb.go are gitignored, so nothing compiles without this.
      - run: bash script/gen-proto.sh
      - name: Go format
        working-directory: core/server
        run: |
          unformatted="$(find . -name '*.go' -type f -print0 | xargs -0 gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            printf 'gofmt required:\n%s\n' "$unformatted" >&2
            exit 1
          fi
      - run: go vet ./...
        working-directory: core/server
      # -race only: it is a superset of the plain run, and the suite is seconds.
      # The IPC dispatcher hands every request to its own goroutine.
      - run: go test -race ./...
        working-directory: core/server
      # Core is the half that touches network traffic, on the sing-box dependency tree
      # nobody here reads. govulncheck is call-graph based: it fails only when this
      # code can actually reach a known-vulnerable symbol, not on every advisory.
      - name: govulncheck
        working-directory: core/server
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  shell:
    name: Shell (Rust, macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      # build.rs runs prost-build against core/server/gen/libcore.proto.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # repo-root rust-toolchain.toml pins 1.94.0; install that, not stable.
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.0'
          cache: 'true'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/backend
      - run: cargo fmt --all -- --check
        working-directory: app/backend
      - run: cargo test --locked --lib
        working-directory: app/backend
      # qt_add_resources embeds QML but does not parse it. Lint every source so
      # syntax/type errors cannot ship as a blank window.
      - name: QML lint
        run: |
          lint_output="$(qmllint -I app/qt/qml app/qt/qml/*.qml 2>&1)" || {
            printf '%s\n' "$lint_output"
            exit 1
          }
          printf '%s\n' "$lint_output"
          if grep -q '^Warning:' <<< "$lint_output"; then
            echo "qmllint emitted warnings" >&2
            exit 1
          fi
      # Compile the actual Qt host and every embedded resource path. The Rust-only
      # check cannot catch a broken C++ bridge or missing resource file.
      - name: Qt host build
        run: |
          cmake -S app/qt -B app/qt/build -DCMAKE_BUILD_TYPE=Release
          cmake --build app/qt/build --target nexus --parallel 2
      # Fail the release gate on known vulnerabilities in the locked Cargo graph.
      - name: cargo audit
        working-directory: app/backend
        run: |
          cargo install cargo-audit --locked
          cargo audit

  release:
    name: Release bundle (macOS)
    needs: [ui, core, shell]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/server/go.mod
          cache-dependency-path: core/server/go.sum
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.94.0
      # build.sh stages the Qt Quick Timeline runtime when macdeployqt does not.
      # The Qt online installer ships Timeline as a separate module, unlike a
      # full Homebrew Qt installation, so CI must request it explicitly.
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.0'
          modules: 'qtquicktimeline'
          cache: 'true'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/backend
      # build.sh is the shipping path. It builds NexusCore + Rust + Qt, deploys
      # Qt runtime files, audits Mach-O loader paths/minimum macOS versions, and
      # verifies the final nested-code signing structure.
      - name: Full release bundle
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: |
          export NEXUS_QT_HOME="$QT_ROOT_DIR"
          export CMAKE_BUILD_PARALLEL_LEVEL=2
          ./build.sh
