[[permission]]
identifier = "allow-nexus-commands"
description = "Allow Nexus app IPC commands (Phase B–E)"
commands.allow = [
  "app_identity",
  "app_quit",
  "qr_svg",
  "core_start",
  "core_query_state",
  "core_check_config",
  "core_stop",
  "store_snapshot",
  "generate_preview",
  "set_system_proxy_cmd",
  "set_system_dns_cmd",
  "set_tun_cmd",
  "connect_selected",
  "disconnect_selected",
  "query_connections",
  "warp_status",
  "warp_set",
  "warp_set_mode",
  "warp_open",
  "sub_fetch",
  "net_tcp_probe",
  "net_tcp_probe_stop",
  "net_resolve_host",
  "net_resolve_hosts"
]
