[[permission]]
identifier = "allow-nexus-commands"
description = "Allow Nexus app IPC commands"
commands.allow = [
  "app_identity",
  "app_quit",
  "qr_svg",
  "core_start",
  "core_query_state",
  "session_status",
  "core_check_config",
  "core_stop",
  "store_snapshot",
  "generate_preview",
  "catalog_get",
  "catalog_put",
  "firewall_status",
  "firewall_helper_install",
  "firewall_helper_uninstall",
  "set_system_proxy_cmd",
  "set_tun_cmd",
  "connect_selected",
  "disconnect_selected",
  "query_connections",
  "query_stats",
  "sub_fetch",
  "sub_parse_clash",
  "sub_parse_share",
  "net_tcp_probe",
  "net_tcp_probe_stop",
  "core_url_test_current",
  "core_url_test_stop",
  "net_resolve_host",
  "net_resolve_hosts"
]
