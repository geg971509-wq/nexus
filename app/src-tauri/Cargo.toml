[package]
name = "nexus"
version = "0.2.3"
description = "Nexus VPN — Rust engine + C ABI (Qt host on macOS)"
authors = ["Nexus"]
edition = "2021"

[lib]
name = "nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nexusfwd"
path = "src/bin/nexusfwd.rs"
required-features = []

[build-dependencies]
prost-build = "0.13"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# TCP probe must bind physical iface under Tun (IP_BOUND_IF); socket2 already transitive.
socket2 = "0.6"
libc = "0.2"
serde_yaml = "0.9"
prost = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
pfctl = "0.7"

# Named-pipe server for Core IPC (already in lock via tauri transitive tree).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_Networking_WinInet",
  "Win32_Security",
  "Win32_Security_Authorization",
] }
