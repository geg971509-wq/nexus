[package]
name = "nexus"
version = "0.2.3"
description = "Nexus VPN — Tauri shell (macOS + Windows)"
authors = ["Nexus"]
edition = "2021"
default-run = "nexus"

[lib]
name = "nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nexus"
path = "src/main.rs"

[[bin]]
name = "core_smoke"
path = "src/bin/core_smoke.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# TCP probe must bind physical iface under Tun (IP_BOUND_IF); socket2 already transitive.
socket2 = "0.6"
libc = "0.2"
serde_yaml = "0.9"

# Named-pipe server for Core IPC (already in lock via tauri transitive tree).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_Networking_WinInet",
  "Win32_Security",
] }
