[package]
name = "nexus"
version = "0.2.3"
description = "Nexus VPN — Rust engine + C ABI (Qt host on macOS)"
authors = ["Nexus"]
edition = "2021"

[lib]
name = "nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nexusfwd"
path = "src/bin/nexusfwd.rs"
required-features = []

[build-dependencies]
prost-build = "0.13"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# TCP probe must bind physical iface under Tun (IP_BOUND_IF); socket2 already transitive.
socket2 = "0.6"
libc = "0.2"
serde_yaml = "0.9"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
pfctl = "0.7"
